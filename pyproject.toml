[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsctech-skills-capabilities"
version = "0.1.0"
description = "Importable, tested capability libraries for LSCTech shared agent skills (see README.md — not a product, not an orchestration system)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
include = ["capabilities*"]

[tool.pytest.ini_options]
testpaths = ["capabilities/tests"]
